<p-dialog [header]="header"
  (onShow)="handleDialogShow()"
  [modal]="true"
  (onHide)="Exit(false);"
  [(visible)]="show"
  appendTo="body"
  [style]="{ width: width || '55vw', minWidth: '420px', maxWidth: '95vw' }"
  [contentStyle]="{ 'max-height': '65vh', 'overflow-y': 'auto' }"
  [baseZIndex]="10000" 
  [autoZIndex]="true"      
  [focusOnShow]="false"
  [draggable]="false"
  [resizable]="false">
    <div>
        <p-table #dt2 [value]="dataArry" selectionMode="single" (onRowClick)="selectItem($event.data)"
            [(selection)]="selectedItem" [globalFilterFields]="keys" (keydown)="onTableKeyDown($event)">
            <ng-template pTemplate="caption">
                <div class="flexSearch">
                    <input #myInput type="text" pInputText [(ngModel)]="searchText"
                        (input)="onInputChange($event.target.value)"
                        (keydown.enter)="onSearch()"
                        (keydown)="onKeyDown($event)"
                        placeholder="Global Filter"
                        style="width: 100%" />
                    <i class="pi pi-search"></i>
                </div>
            </ng-template>
            <ng-template pTemplate="header">
                <tr>
                    <ng-container *ngFor="let data of columns">
                        <th>{{data}}</th>
                    </ng-container>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-data>
                <tr [pSelectableRow]="data" (click)="selectItem(data)">
                    <ng-container *ngFor="let item of data | keyvalue">
                        <td class="center-text">{{item.value}}</td>
                    </ng-container>
                </tr>
            </ng-template>
        </p-table>
    </div>
</p-dialog>
