<app-page-header [nav]='[{label: "account"| translate},{label: "Accounts Outstanding"| translate}]'
    [title]='title| translate'></app-page-header>
<p-toolbar>
    <div class="ui-toolbar-group-left">
        <button pButton type="button" label="Print" icon="fa fa-print" class="ui-button-success"
            (click)="displayPrint()"></button>
        <button pButton type="button" label="Close" icon="fa fa-close" class="ui-button-danger"></button>
    </div>
</p-toolbar>

<div class="card card-w-title">
    <p-tabView [activeIndex]="index">
        <p-tabPanel [header]="'Accounts Outstanding'| translate">
            <div class="p-grid p-fluid">
                <div class="p-col-12 p-md-3">
                </div>
                <div class="p-col-12 p-md-2">
                    <button pButton type="button" style="width: 80%;" font-size="18px" label="Customer"
                        class="ui-button-danger"></button>
                </div>
                <div class="p-col-12 p-md-2">
                    <button pButton type="button" style="width: 80%;" font-size="18px" label="SuppLier"
                        class="ui-button-success"></button>
                </div>
            </div>
            <div class="p-grid p-ai-center">
                <div class="p-col-12 p-md-3">
                </div>
                <div class="p-col-12 p-md-5">
                    <p-checkbox label="Select All"></p-checkbox>

                </div>
            </div>
            <div class="p-grid">
                <div class="p-col-12 p-md-3">
                </div>
                <div class="p-col-12 p-md-7 ">
                    <p-table>
                        <ng-template pTemplate="header">
                            <tr>
                                <th>Account No</th>
                                <th>Account Name</th>
                            </tr>
                        </ng-template>
                        <ng-template pTemplate="body"> 
                            <tr>
                                <td> </td>
                                <td> </td>
                            </tr>
                        </ng-template>
                    </p-table>
                </div>

            </div>
        </p-tabPanel>
    </p-tabView>
</div>
<p-dialog header="Print Preview" [(visible)]="displayPrintPreview" [modal]="true" [style]="{width: '90%'}"
    [maximizable]="true" [baseZIndex]="100" [draggable]="false" [resizable]="false">
    <button (click)="printAsPDF()" pButton class="ui-button-info" label="Print" icon="pi pi-print">    </button>

        <div id="print">
            <h1 class="mainhead">INSPIRE ERP SYSTEMS </h1>
            <h2 class="subhead">DUBAI, UAE</h2>
            <h3 class="head">ACCOUNTS RECEIVABLE</h3>

            <table class="Account">
                <tr>
                    <th>inv.Date</th>
                    <th>Inv.No</th>
                    <th>Due On</th>
                    <th>Invoiced Amt.</th>
                    <th>Amt. Received</th>
                    <th>Pending Amt.</th>
                    <th>Overdue Days </th>

                </tr>
                <tr>
                    <td colspan="5" style="background-color:  rgb(188, 208, 216);">Customer Name</td>
                    <td colspan="2">Credit Days:</td>
                </tr>
                <tr>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
            </table>
        </div>
</p-dialog>
