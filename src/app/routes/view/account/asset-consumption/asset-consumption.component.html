<app-page-header [title]="title | translate"></app-page-header>
<p-toolbar>
  <div class="ui-toolbar-group-left">
    <button
      pButton
      type="button"
      label="New"
      icon="fa fa-floppy-o"
      class="ui-button-info"
    ></button>
    <button
      pButton
      type="button"
      label="Edit"
      icon="pi pi-pencil"
      class="ui-button-primery"
    ></button>
    <button
      pButton
      type="button"
      label="Cancel"
      icon="pi pi-times"
      class="ui-button-warning"
    ></button>
    <button
      pButton
      type="button"
      label="Save"
      icon="pi pi-save"
      class="ui-button-success"
    ></button>
    <button
      pButton
      type="button"
      label="List"
      icon="pi pi-list"
      class="ui-button-info"
    ></button>
    <button
      pButton
      type="button"
      label="Print"
      icon="pi pi-print"
      class="ui-button-info"
    ></button>
    <button
      pButton
      type="button"
      label="Delete"
      icon="pi pi-trash"
      class="ui-button-danger"
    ></button>
    <button
      pButton
      type="button"
      label="Exit"
      icon="pi pi-sign-out"
      class="ui-button-danger"
    ></button>
  </div>
</p-toolbar>

<div class="card card-w-title">
  <p-tabView [activeIndex]="index" (onChange)="handleChange($event)">
    <p-tabPanel [header]="'Asset Consumption' | translate">
      <div class="p-grid p-ai-center">
        <label class="p-col-12 p-md-1" for="account">
          {{ "Voucher No." | translate }}
        </label>
        <div class="p-col-12 p-md-5">
          <input pInputText placeholder="No." />
        </div>
        <label class="p-col-12 p-md-1" for="account">
          {{ "Voucher Dt" | translate }}
        </label>
        <div class="p-col-12 p-md-5">
          <p-calendar
            appendTo="body"
            dateFormat="dd/mm/yy"
            [showButtonBar]="true"
            [monthNavigator]="true"
            [yearNavigator]="true"
            yearRange="2000:2040"
            class="w-100"
            useUtc
            [showIcon]="true"
            formControlName="VoucherDate"
          >
          </p-calendar>
        </div>
      </div>
      <div class="p-grid p-ai-center">
        <label class="p-col-12 p-md-1" for="account">
          {{ "Job" | translate }}
        </label>
        <div class="p-col-12 p-md-5">
          <p-dropdown filter="true" class="w-100" [filter]="true"> </p-dropdown>
        </div>
        <label class="p-col-12 p-md-1" for="account">
          {{ "Ref No." | translate }}
        </label>
        <div class="p-col-12 p-md-5">
          <input pInputText placeholder="No." />
        </div>
      </div>
      <div class="p-grid p-ai-center">
        <label class="p-col-12 p-md-1" for="account">
          {{ "Narration" | translate }}
        </label>
        <div class="p-col-12 p-md-5">
          <textarea
            pTextArea
            rows="5"
            class="w-100"
            placeholder="Narration"
          ></textarea>
        </div>
      </div>
      <div class="grid">
        <p-panel header="Detail">
          <div class="p-col-12">
            <hot-table
              [hotId]="hotid"
              [licenseKey]="licensekey"
              [settings]="assetconsumption"
            >
            </hot-table>
          </div>
        </p-panel>
      </div>
    </p-tabPanel>
  </p-tabView>
</div>

<div class="p-d-flex p-jc-end p-mt-3">
  <h3>Grand Total:</h3>
</div>
