<app-page-header [title]="title | translate"></app-page-header>
<p-toolbar>
  <div class="ui-toolbar-group-left">
    <button
      pButton
      type="button"
      [label]="'Add New'"
      icon="fa fa-plus"
      class="ui-button-primary"
    ></button>

    <button
      pButton
      type="button"
      [label]="'Print'"
      icon="fa fa-print"
      class="ui-button-success"
    ></button>
    <button
      pButton
      type="button"
      [label]="'Exit'"
      icon="fa fa-close"
      class="ui-button-danger"
    ></button>
  </div>
</p-toolbar>
<p-tabView [activeIndex]="index" (onChange)="handleChange($event)">
  <p-tabPanel
    [header]="'Purchase List' | translate"
    [formGroup]="purchaseReport"
  >
    <div class="p-grid">
      <div class="p-col-6 p-md-6 p-lg-6">
        <div class="p-grid">
          <label class="p-col-3 p-md-3 p-lg-3" for="account">
            <b>{{ "Account Name:" | translate }}</b>
          </label>
          <div class="p-col-9 p-md-9 p-lg-9">
            <p-dropdown filter="true" formControlName="AccName"> </p-dropdown>
          </div>
        </div>
      </div>
      <div class="p-col-6">
        <p-panel>
          <p-header>
            <p-checkbox
              [binary]="true"
              label="ByDate"
              formControlName="isDate"
            ></p-checkbox>
          </p-header>
          <div class="p-grid">
            <label class="p-col-12 p-md-12 p-lg-2">{{
              "Date From" | translate
            }}</label>
            <div class="p-col-12 p-md-12 p-lg-10">
              <p-calendar
                appendTo="body"
                dateFormat="dd/mm/yy"
                showIcon="true"
                formControlName="DateFrom"
                useUtc
                class="w-200"
              >
              </p-calendar>
            </div>
          </div>
          <div class="p-grid">
            <label class="p-col-12 p-md-12 p-lg-2">{{
              "Date To" | translate
            }}</label>
            <div class="p-col-12 p-md-12 p-lg-10">
              <p-calendar
                appendTo="body"
                dateFormat="dd/mm/yy"
                showIcon="true"
                useUtc
                formControlName="DateTo"
                class="w-200"
              >
              </p-calendar>
            </div>
          </div>
        </p-panel>
      </div>
    </div>

    <div class="card card-w-title">
      <p-tabView [activeIndex]="index" (onChange)="handleChange($event)">
        <p-tabPanel [header]="'Details' | translate">
          <div class="grid">
            <div class="p-col-12">
              <hot-table
                [hotId]="hotid"
                [data]="dataset"
                [licenseKey]="licensekey"
                [settings]="purchaseListSettings"
              ></hot-table>
            </div>
          </div>
        </p-tabPanel>
      </p-tabView>
    </div>
  </p-tabPanel>
</p-tabView>
