<svg class="circular-progress" viewBox="0 0 100 100">
  <circle class="progress-background" cx="50" cy="50" r="40"></circle>
  <circle class="progress-bar" cx="50" cy="50" r="40" [style.strokeDasharray]="circumference"
    [style.strokeDashoffset]="offset" [style.stroke]="strokeColor"></circle>
  <text x="50" y="50" text-anchor="middle" dy="7" font-size="14" fill="#000">
    {{ value }}%
  </text>
</svg>
