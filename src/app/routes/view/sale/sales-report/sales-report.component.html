<app-page-header
  [nav]="[
    { label: 'account' | translate },
    { label: 'Sales Report' | translate }
  ]"
  [title]="title | translate"
></app-page-header>
<p-toolbar>
  <div class="ui-toolbar-group-left">
    <button
      pButton
      type="button"
      label="Show"
      [disabled]="!Permission?.View"
      icon="fa fa-list"
      class="ui-button-info"
      (click)="getSalesReport()"
    ></button>
    <button
      pButton
      type="button"
      class="ui-button-danger"
      label="Clear All"
      (click)="cancelAll()"
      icon="fa fa-ban"
    ></button>
  </div>
  <div class="ui-toolbar-group-right">
    <button
      pButton
      type="button"
      (click)="showPrint()"
      label="Show Print"
      icon="fa fa-print"
      class="ui-button-success"
    ></button>

    <button pButton type="button" label="Exit" icon="fa fa-sign-out"></button>
  </div>
</p-toolbar>
<div class="card">
  <p-tabView>
    <p-tabPanel [header]="'Sales Report' | translate">
  <div class="p-grid">
    <div class="p-sm-12 p-md-6 p-lg-4">
      <p-panel>
        <p-header>
          {{ "Customer Details" | translate }}
        </p-header>
        <div class="min-panel">
          <div class="p-grid inputGroup">
            <label class="p-col-3">Customer</label>
            <div class="p-col-9">
              <p-dropdown
                appDropdownOptionTitle
                filter="true"
                [options]="customerList"
                [(ngModel)]="customer"
                name="customer"
                [ngModelOptions]="{ standalone: true }"
                optionLabel="customerMasterCustomerName"
                id="customer"
                [showClear]="true"
                placeholder="---- Select Customer ----"
                (onClick)="getAllCustomers()"
              >
              </p-dropdown>
            </div>
          </div>
          <div class="p-grid inputGroup">
            <label class="p-col-3">{{ "Item Group" | translate }}</label>
            <div class="p-col-9">
              <p-dropdown
                [disabled]="salesReportType === 'GetSalesReportSummaryWise'"
                filter="true"
                class="w-100"
                [(ngModel)]="itemGroup"
                id="rptItem"
                [options]="ItemMasterGroupList"
                placeholder="---- Select Group ----"
                [showClear]="true"
                (onClick)="LoadDropdownItemGroupMaster()"
              >
              </p-dropdown>
            </div>
          </div>

          <div class="p-grid">
            <div class="p-col-3">
              <label>{{ "Item" | translate }}</label>
            </div>
            <div class="p-col-9">
              <div class="ui-inputgroup">
                <input
                  type="text"
                  #acctCtrl
                  pInputText
                  [(ngModel)]="itemName"
                  style="margin-top: -5px"
                  placeholder="Item List"
                />
                <button
                  *ngIf="itemName"
                  pButton
                  type="button"
                  pRipple
                  icon="pi pi-times"
                  (click)="clearItem()"
                  styleClass="p-button-secondary"
                  style="margin-top: -5px"
                ></button>
                <button
                  pButton
                  type="button"
                  pRipple
                  icon="pi pi-search"
                  (click)="openItemMasterLookUp()"
                  styleClass="p-button-warn"
                  style="margin-top: -5px"
                ></button>
              </div>
            </div>
          </div>
        </div>
      </p-panel>
    </div>

    <div class="p-col-4">
      <p-panel>
        <p-header>Voucher Type</p-header>
        <div class="p-grid">
          <div class="p-col-4">
            <label>Voucher Type</label>
          </div>
          <div class="p-col-8">
            <p-dropdown
              [disabled]="salesReportType === 'GetSalesReportDetailWise'"
              filter="true"
              [options]="invoiceTlist"
              optionLabel
              [showClear]="true"
              [(ngModel)]="invoiceType"
              name="invoiceType"
              [ngModelOptions]="{ standalone: true }"
              placeholder="---- Select Voucher Type ----"
            >
            </p-dropdown>
          </div>
          <label class="p-col-4" for="account">
            {{ "Sales Man" | translate }}
          </label>
          <div class="p-col-8">
            <p-dropdown
              filter="true"
              [style]="{ width: '100%' }"
              placeholder="--- SalesMan ---"
              [options]="Salesman"
              (onClick)="GetSalesmanMasterGroup()"
              [(ngModel)]="selectedSalesMan"
            >
            </p-dropdown>
          </div>
        </div>
        <div class="p-grid inputGroup">
          <label class="p-col-4">Location</label>
          <div class="p-col-8">
            <p-dropdown
              filter="true"
              [options]="locationList"
              [(ngModel)]="location"
              name="location"
              [ngModelOptions]="{ standalone: true }"
              optionLabel="locationMasterLocationName"
              [showClear]="true"
              (onClick)="getAllLocation()"
              placeholder="---- Select Location ----"
            >
            </p-dropdown>
          </div>
        </div>
        <div class="p-grid inputGroup">
          <div class="p-col-6">
            <div class="flex align-items-center">
              <input
                type="radio"
                name="salesReportType"
                (click)="initializeControlsDetail()"
                [(ngModel)]="salesReportType"
                [value]="'GetSalesReportDetailWise'"
                id="btn1"
                checked
              />
              <label for="btn1" style="margin-left: 10px" class="ml-2"
                >Detail</label
              >
            </div>
          </div>
          <div class="p-col-6">
            <div class="flex align-items-center">
              <input
                type="radio"
                name="salesReportType"
                (click)="initailizeControlSummary()"
                [(ngModel)]="salesReportType"
                [value]="'GetSalesReportSummaryWise'"
                id="btn2"
              />
              <label for="btn2" style="margin-left: 10px" class="ml-2"
                >Summary</label
              >
            </div>
          </div>
        </div>
      </p-panel>
    </div>
    <div class="p-col-4">
      <app-datefilter
        [enableDate]="enableDate"
        (enableDateChange)="enableDate = $event"
      ></app-datefilter>
    </div>
  </div>
<div class="card">
  <div class="p-grid">
    <div
      class="p-col-12"
      *ngIf="salesReportType === 'GetSalesReportDetailWise'"
    >
      <div class="p-col-12 tbl-maxheight">
        <hot-table
          [hotId]="hotidD"
          [licenseKey]="licensekey"
          [settings]="salesReportDetail"
        >
        </hot-table>
      </div>
    </div>
    <div
      class="p-col-12"
      *ngIf="salesReportType === 'GetSalesReportSummaryWise'"
    >
      <div class="p-col-12 tbl-maxheight">
        <hot-table
          [hotId]="hotidS"
          [licenseKey]="licensekey"
          [settings]="salesReportSummary"
        >
        </hot-table>
      </div>
    </div>
    <div class="p-col-12">
      <table class="Acc table">
        <tr>
          <th></th>
          <th style="text-align: center">Gross Amount</th>
          <th style="text-align: center">Discount</th>
          <th style="text-align: center">Vat Amount</th>
          <th style="text-align: center">RoundOff</th>
          <th style="text-align: center">Nat Amount</th>
          <!-- <td><strong></strong></td> -->
        </tr>
        <tr>
          <td>Total</td>
          <td style="text-align: center">
            <!-- <strong>Total Gross Amount:</strong> -->
            {{ totalGrossAmount }}
          </td>
          <td style="text-align: center">
            <!-- <strong>Total Discount:</strong>  -->
            {{ totalDiscount }}
          </td>
          <td style="text-align: center">
            <!-- <strong>Total VAT Amount:</strong> -->
            {{ totalVatAmount }}
          </td>
          <td style="text-align: center">
            <!-- <strong>Total Roundoff: </strong>  -->
            {{ totalRoundoff }}
          </td>
          <td style="text-align: center">
            <!-- <strong>Total Net Amount: </strong> -->
            {{ totalNetAmount }}
          </td>
          <!-- <td><strong></strong></td> -->
        </tr>
      </table>
    </div>
  </div>
</div>
    </p-tabPanel>
    <p-tabPanel [header]="'Analysis' | translate">
      <app-sales-voucher-analysis></app-sales-voucher-analysis>
    </p-tabPanel>
  </p-tabView>
</div>

<ng-container *ngIf="showItemMasterLookUp">
  <app-lookup
    [header]="'Item Look Up'"
    [dataArry]="dataList"
    [isServerSearch]="isServerSearch"
    [selectedItem]="selectItem"
    [searchText]="''"
    [columns]="lookupColumns"
    (selectItemEvent)="selectedItem($event)"
    (exitEvent)="hide($event)"
    [cell]="activeRow"
    (clearEvent)="hide($event)"
    (hideDialogEvent)="hide($event)"
    (searchEvent)="onSearchItemMaster($event)"
    [tableheader]="'Item List'"
    [(show)]="showItemMasterLookUp"
  ></app-lookup>
</ng-container>

<p-toast></p-toast>
