<app-page-header [title]="title | translate"></app-page-header>
<p-toolbar>
  <div class="ui-toolbar-group-left">
    <button
      pButton
      type="button"
      class="ui-button-warning"
      (click)="clearfilter()"
      label="Enable&Clear"
      icon="fa fa-pencil"
    ></button>
    <button
      pButton
      type="button"
      class="ui-button-info"
      (click)="show()"
      [disabled]="!Permission?.View"
      label="Show"
      icon="fa fa-search"
    ></button>
    <button
      pButton
      type="button"
      class="ui-button-success"
      (click)="ExportExcel()"
      label="Excel"
      icon="fa fa-file-excel-o"
    ></button>
    <button
      pButton
      type="button"
      class="ui-button-danger"
      (click)="ExitNew()"
      label="Exit"
      icon="fa fa-sign-out"
    ></button>
  </div>
</p-toolbar>
<div class="card card-w-title" [formGroup]="CustomerOrderTrackingFormGroup">
  <p-tabView [activeIndex]="index" (onChange)="handleChange($event)">
    <p-tabPanel [header]="' Customer Order Tracking' | translate">
      <div class="p-grid">
        <div class="p-col-6">
          <div class="p-grid">
            <div class="p-col-2 p-md-2 p-lg-2">
              <b>{{ "Customer" | translate }}</b>
            </div>
            <div class="p-col-10 p-md-10 p-lg-10">
              <!-- <input id="enquiryNo" type="text" pInputText> -->
              <p-dropdown
                appDropdownOptionTitle
                filter="true"
                class="w-100"
                formControlName="customerName"
                [options]="CustomerMasterList"
                (onChange)="onChange($event, 'customer')"
              ></p-dropdown>
            </div>
          </div>
          <div class="p-grid">
            <div class="p-col-2 p-md-2 p-lg-2">
              <b>{{ "Location" | translate }}</b>
            </div>
            <div class="p-col-10 p-md-10 p-lg-10">
              <p-dropdown
                filter="true"
                class="w-100"
                formControlName="Location"
                [options]="locationList"
                (onChange)="onChange($event, 'location')"
              >
              </p-dropdown>
            </div>
          </div>
          <!-- <div class="p-grid">
                        <div class="p-col-2 p-md-2 p-lg-2"><b>{{'LPO Search'| translate}}</b></div>
                        <div class="p-col-10 p-md-10 p-lg-10">
                            <p-dropdown filter="true" class="w-100" formControlName='LPONo'
                            [options]="null" filter="true">
                        </p-dropdown>
                        </div>
                    </div> -->
          <div class="p-grid">
            <div class="p-col-4 p-md-4 p-lg-4 bold-font">
              <p-radioButton
                formControlName="type"
                (click)="CheckedType('Detail')"
                name="radioType"
                value="Detail"
                label="Detail"
              ></p-radioButton>
            </div>
            <div class="p-col-4 p-md-4 p-lg-4 bold-font">
              <p-radioButton
                (click)="CheckedType('Summary')"
                formControlName="type"
                name="radioType"
                value="Summary"
                label="Summary"
              ></p-radioButton>
            </div>
            <!-- <div class="p-col-2 p-md-2 p-lg-2">
                            <p-checkbox style="color: rgb(7, 103, 47); font-weight: bold;" label="All"></p-checkbox>
                        </div> -->
          </div>
        </div>
        <div class="p-col-6">
          <p-panel>
            <p-header>
              <div class="p-col-12 p-md-12 p-lg-12">
                <p-checkbox
                  formControlName="isDate"
                  [binary]="true"
                  label="ByDate"
                  (onChange)="onDateCheckboxChange($event)"
                ></p-checkbox>
              </div>
            </p-header>
            <div class="p-grid">
              <div class="p-col-2 p-md-2 p-lg-2">
                <b>{{ "Date From" | translate }}</b>
              </div>
              <div class="p-col-10 p-md-10 p-lg-10">
                <p-calendar
                  appendTo="body"
                  dateFormat="dd/mm/yy"
                  [showButtonBar]="true"
                  [monthNavigator]="true"
                  [yearNavigator]="true"
                  yearRange="2000:2040"
                  showIcon="true"
                  useUtc
                  formControlName="dateFrom"
                  class="w-200"
                  [disabled]="
                    !CustomerOrderTrackingFormGroup.get('isDate').value
                  "
                >
                </p-calendar>
              </div>
            </div>
            <div class="p-grid">
              <div class="p-col-2 p-md-2 p-lg-2">
                <b>{{ "Date To" | translate }}</b>
              </div>
              <div class="p-col-10 p-md-10 p-lg-10">
                <p-calendar
                  appendTo="body"
                  dateFormat="dd/mm/yy"
                  [showButtonBar]="true"
                  [monthNavigator]="true"
                  [yearNavigator]="true"
                  yearRange="2000:2040"
                  showIcon="true"
                  useUtc
                  formControlName="dateTo"
                  class="w-200"
                  [disabled]="
                    !CustomerOrderTrackingFormGroup.get('isDate').value
                  "
                >
                </p-calendar>
              </div>
            </div>
          </p-panel>
        </div>
      </div>
    </p-tabPanel>
  </p-tabView>
  <div class="p-col-12 p-lg-12 p-md-12">
    <div class="card card-w-title">
      <p-tabView [activeIndex]="index" (onChange)="handleChange($event)">
        <p-tabPanel [header]="'COT Details' | translate">
          <div
            class="p-col-12"
            *ngIf="
              CustomerOrderTrackingFormGroup.get('type').value == 'Summary'
            "
          >
            <hot-table
              [hotId]="hotid"
              [data]="dataset"
              [licenseKey]="licensekey"
              [settings]="CustomerOrderReportBySummary"
            >
            </hot-table>
          </div>
          <div
            class="p-col-12"
            *ngIf="CustomerOrderTrackingFormGroup.get('type').value == 'Detail'"
          >
            <hot-table
              [hotId]="hotid"
              [data]="dataset"
              [licenseKey]="licensekey"
              [settings]="CustomerOrderReport"
            >
            </hot-table>
          </div>
        </p-tabPanel>
      </p-tabView>
    </div>
  </div>
</div>
