<app-page-header [title]='title| translate'></app-page-header>
<p-toolbar>
    <div class="ui-toolbar-group-left">
        <button pButton type="button" [label]="'Run Updates'" (click)="updateSettings()" icon="fa fa-cog" class="ui-button-info"></button>
        <button pButton type="button" [label]="'Exit'" icon="fa fa-close" (click)='ExitNew()'
            class="ui-button-warning"></button>
    </div>
</p-toolbar>
<!-- (click)='updateSettings()'-->

<div class="card card-w-title">
    <p-tabView [activeIndex]="index" (onChange)="handleChange($event)">
        <p-tabPanel [header]="'Options Settings'| translate">
        
            <div class="p-col-12 p-md-4">
                <div class="ui-inputgroup">
                    <input type="text" pInputText placeholder="Search"
                        [(ngModel)]="search">
                    <button pButton type="button" icon="pi pi-search"
                        (click)='getOptionsetting()' class="ui-button-warn"></button>
                </div>
            </div>
            <p-tabView [activeIndex]="index" (onChange)="handleChange($event)">
                <p-tabPanel [header]="'Boolean'| translate">
                    <p-table [value]="optionsetting">
                        <ng-template pTemplate="header">
                            <tr>
                                <th class="th1">Description</th>
                                <th>Value</th>
                            </tr>
                        </ng-template>
                        <ng-template pTemplate="body" let-data>
                            <tr>
                                <td *ngIf="data.optionsMasterValueType == 'Boolean'">
                                    {{data.optionsMasterFullDescription}} ({{data.optionsMasterDescription}})
                                </td>
                                <td *ngIf="data.optionsMasterValueType == 'Boolean'">
                                    <div >
                                        <!-- <p-checkbox name="group1" binary="true"
                                        [label]="data.optionsMasterType === 'YES' ? 'Yes': 'No'"
                                        [(ngModel)]="data.optionsMasterType"
                                        (onChange)="handleData($event)">x
                                    </p-checkbox> -->
                                    <p-checkbox name="group1" binary="true"
                                    [label]="data.optionsMasterType === 'YES' ? 'Yes' : 'No'"
                                    [ngModel]="convertToBoolean(data.optionsMasterType)"
                                    (ngModelChange)="handleData($event ? 'YES' : 'NO', data.optionsMasterFullDescription)">
                                  </p-checkbox>
                                    </div>
                                </td>
                            </tr>
                        </ng-template>
                    </p-table>
                </p-tabPanel>
                <p-tabPanel [header]="'Value'| translate">
                    <p-table [value]="optionsetting">
                        <ng-template pTemplate="header">
                            <tr>
                                <th class="th1">Description</th>
                                <th>Value</th>
                            </tr>
                        </ng-template>
                        <ng-template pTemplate="body" let-data>
                            <tr>
                                <td *ngIf="data.optionsMasterValueType != 'Boolean'">{{data.optionsMasterFullDescription}}
                                    ({{data.optionsMasterDescription}})
                                </td>
                                <td *ngIf="data.optionsMasterValueType != 'Boolean'">

                                     <div *ngIf="data.optionsMasterValueType === 'Numeric'" class="w-100" >
                                         <p-inputNumber class="w-100" [(ngModel)]="data.optionsMasterType"></p-inputNumber>
                                    </div>

                                    <div *ngIf="data.optionsMasterValueType === 'File'">
                                        <p-dropdown filter="true" [options]="data.options" optionLabel="keyText" dataKey="keyValue"
                                         [(ngModel)]="data.optionsMasterType"  [filter]="true" [showClear]="true" (onChange)="onOptionSelect(data.optionsMasterType)">
                                        </p-dropdown>
                                    </div>
                                    
                                    <div *ngIf="data.optionsMasterValueType === 'Value'">
                                        <input type="text" pInputText [(ngModel)]="data.optionsMasterType" />
                                    </div>  
                                </td>
                               
                            </tr>
                        </ng-template>
                    </p-table>
                </p-tabPanel>
            </p-tabView>
                    
        </p-tabPanel>
    </p-tabView>
</div>

<p-toast></p-toast>
