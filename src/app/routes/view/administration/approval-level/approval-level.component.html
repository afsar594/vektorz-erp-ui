<app-page-header [title]='title| translate'></app-page-header>
<p-toolbar>
    <div class="ui-toolbar-group-left">
        <button pButton type="button" [label]="'Edit'" (click)="isdisabled = false" icon="fa fa-pencil"
            class="ui-button-info"></button>
        <!-- <button pButton type="button" [label]="'Save'" icon="fa fa-save" class="ui-button-success"></button> -->
        <button pButton type="button" [label]="'Save'" (click)="save()" icon="fa fa-save"
            class="ui-button-success"></button>
        <button pButton type="button" [label]="'Cancel'" (click)="isdisabled = false" icon="fa fa-close"
            class="ui-button-warning"></button>
        <button pButton type="button" [label]="'Exit'" routerLink="/dashboard" icon="fa fa-sign-out"
            class="ui-button-danger"></button>
    </div>
</p-toolbar>

<div class="card card-w-title">
    <p-tabView>
        <p-tabPanel [header]="'Permission Approval'| translate">
            <div class="p-grid">
                <div class="p-col-12 p-md-2">
                    <label>{{'Permission Approval'| translate}}</label>
                </div>
                <div class="p-col-12 p-md-4">
                    <div class="ui-inputgroup">
                        <p-dropdown filter="true" [filter]="true" [options]="approvalDropdown"
                            [(ngModel)]="selectedForm" [showClear]="true" class="w-100"
                            (onChange)="GetApproverLevelSettings($event)"></p-dropdown>

                    </div>
                </div>
                <div *ngIf="jobStatus" class="p-col-12 p-md-2">
                    <label>{{'Job'| translate}}</label>
                </div>
                <div *ngIf="jobStatus" class="p-col-12 p-md-4">
                    <div class="ui-inputgroup">
                        <p-dropdown filter="true" [filter]="true" [options]="jobList" [(ngModel)]="selectedjob"
                            [showClear]="true" class="w-100"></p-dropdown>

                    </div>
                </div>
            </div>

            <p-tabView>
                <p-tabPanel [header]="'Details'| translate">
                    <p-table [value]="approverLevels">
                        <ng-template pTemplate="header">
                            <tr>
                                <th>Levels</th>
                                <th>User</th>
                                <th style="width: 80px;">Opt Email</th>
                                <th>Notification Days</th>
                                <th>Min Amount</th>
                                <th>Max Amount</th>
                                <!-- <th>Emails</th> -->
                            </tr>
                        </ng-template>


                        <ng-template pTemplate="body" let-data let-i="rowIndex">
                            <tr>
                                <td>{{data.Level}}</td>
                                <td>
                                    <!-- <p-dropdown filter="true" [disabled]="isdisabled" [filter]="true" [options]="Users"
                                        [(ngModel)]="data.approverId" class="w-100">
                                    </p-dropdown> -->
                                    <p-multiSelect [options]="Users" [disabled]="isdisabled" [(ngModel)]="data.approverIds"   [style]="{width: '100%'}"
                                        (onChange)="onSelectionChange($event)"></p-multiSelect>

                                </td>
                                <td class="center">
                                    <p-checkbox [disabled]="isdisabled" [(ngModel)]="data.optEmail" binary="true">
                                    </p-checkbox>
                                </td>
                                <td>
                                    <input type="number" [disabled]="isdisabled" pInputText
                                        [ngModelOptions]="{standalone: true}" [style]="{width:'auto'}"
                                        [(ngModel)]="data.notificationDays" />
                                </td>
                                <td>
                                    <input type="number" [disabled]="isdisabled" pInputText
                                        [ngModelOptions]="{standalone: true}" [style]="{width:'auto'}"
                                        [(ngModel)]="data.minAmount" />
                                </td>
                                <td>
                                    <input type="number" [disabled]="isdisabled" pInputText
                                        [ngModelOptions]="{standalone: true}" [style]="{width:'auto'}"
                                        [(ngModel)]="data.maxAmount"  />
                                </td>
                                <!-- (keydown.enter)="pustnewRow()" -->
                                <!-- <td>
                                    <button [disabled]="isdisabled" pButton type="button" label="cc"
                                        (click)="show(data.metaData,'cc',i)" class="ui-button-info"></button>
                                    <button [disabled]="isdisabled" pButton type="button" label="bcc"
                                        (click)="show(data.metaData,'bcc',i)" class="ui-button-info"></button>
                                    
                                </td> -->
                            </tr>
                        </ng-template>
                    </p-table>

                </p-tabPanel>
            </p-tabView>
        </p-tabPanel>
    </p-tabView>
</div>

<p-toast></p-toast>

<p-confirmDialog key="confirm-key" acceptLabel="Yes" rejectLabel="No" header="Confirm"></p-confirmDialog>

<p-dialog header="Email" [(visible)]="displayMaximizable" [style]="{ width: '50%' }">

    <div class="p-grid">
        <div class="p-col-12 p-md-2">
            <label>{{'Name'| translate}}</label>
        </div>
        <div class="p-col-12 p-md-4">
            <div class="ui-inputgroup">
                <input type="number" type="text" pInputText [ngModelOptions]="{standalone: true}"
                    [style]="{width:'auto'}" [(ngModel)]="name" />
            </div>
        </div>
        <div class="p-col-12 p-md-2">
            <label>{{'Email'| translate}}</label>
        </div>
        <div class="p-col-12 p-md-4">
            <div class="ui-inputgroup">
                <input type="number" type="text" pInputText [ngModelOptions]="{standalone: true}"
                    [style]="{width:'auto'}" [(ngModel)]="email" />
            </div>
        </div>
    </div>
    <p-table [value]="mails">
        <ng-template pTemplate="header">
            <tr>
                <th>Name</th>
                <th>Email</th>
            </tr>
        </ng-template>


        <ng-template pTemplate="body" let-meta>
            <tr>


                <td>
                    <input type="number" type="text" pInputText [ngModelOptions]="{standalone: true}"
                        [style]="{width:'auto'}" [(ngModel)]="meta.name" />
                </td>
                <td>
                    <input type="number" type="text" pInputText [ngModelOptions]="{standalone: true}"
                        [style]="{width:'auto'}" [(ngModel)]="meta.email"
                        (keyup.enter)="pushEmptyDatastaffEXs(false)" />
                </td>

            </tr>
        </ng-template>
    </p-table>

    <div class="p-2 end">
        <!-- <button pButton type="button" (click)="onConfirm()" label="Yes" icon="pi pi-close"></button> -->
        <button pButton type="button" class="ui-button-danger" (click)="mapVales()" label="Ok"
            icon="pi pi-close"></button>
    </div>


</p-dialog>
