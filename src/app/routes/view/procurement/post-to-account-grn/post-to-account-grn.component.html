<app-page-header [title]='title| translate'></app-page-header>
<p-toolbar>
    <div class="ui-toolbar-group-left">
        <button pButton type="button" label="New" icon="fa fa-plus" class="ui-button-info"></button>
        <button pButton type="button" label="Save" icon="fa fa-save" class="ui-button-success"></button>
        <button pButton type="button" label="Delete" icon="fa fa-trash" class="ui-button-danger"></button>
        <button pButton type="button" label="Exit" icon="fa fa-sign-out" class="ui-button-warning"></button>
    </div>
</p-toolbar>
<div class="card card-w-title">
    <p-tabView [activeIndex]="index" (onChange)="handleChange($event)">
        <p-tabPanel [header]="'Post To Account Grn' | translate">
            <div class="grid">
                <div class="p-col-12">
                    <hot-table [hotId]="hotid" [data]=" dataset" [licenseKey]="licensekey"
                        [settings]="posttoaccountgrn">
                    </hot-table>
                </div>
            </div>
        </p-tabPanel>
    </p-tabView>
</div>
