<app-page-header
  [nav]="[
    { label: 'procurement' | translate },
    { label: 'purchase Requisition S tatus Report' | translate }
  ]"
  [title]="title | translate"
></app-page-header>
<p-toolbar>
  <div class="ui-toolbar-group-right">
    <button
      pButton
      type="button"
      label="Show"
      [disabled]="!Permission?.View"
      icon="fa fa-search"
      class="ui-button-info"
    ></button>
    <button
      pButton
      type="button"
      class="ui-button-success"
      label="Export"
      icon="fa fa-plus"
    ></button>
    <button
      pButton
      type="button"
      label="Close"
      [disabled]="!Permission?.Delete"
      label="Cancel"
      icon="fa fa-close"
      class="ui-button-danger"
    ></button>
  </div>
</p-toolbar>
<div class="card card-w-title">
  <p-tabView [activeIndex]="index" (onChange)="handleChange($event)">
    <p-tabPanel [header]="'Purchase Order Approval Status' | translate">
      <p-panel>
        <p-header>
          <input type="checkbox" pInputCheck /> {{ "By Date" | translate }}
        </p-header>
        <div class="p-grid">
          <div class="p-col-1 p-md-1 p-lg-1">
            <label>{{ "From Date:" | translate }}</label>
          </div>
          <div class="p-col-5 p-md-5 p-lg-5">
            <p-calendar
              appendTo="body"
              dateFormat="dd/mm/yy"
              [showButtonBar]="true"
              [monthNavigator]="true"
              [yearNavigator]="true"
              yearRange="2000:2040"
              id="dateFrom"
              useUtcn
              class="w-100"
              [showIcon]="true"
            >
            </p-calendar>
          </div>
          <div class="p-col-1 p-md-1 p-lg-1">
            <label>{{ "To Date:" | translate }}</label>
          </div>
          <div class="p-col-5 p-md-5 p-lg-5">
            <p-calendar
              appendTo="body"
              dateFormat="dd/mm/yy"
              [showButtonBar]="true"
              [monthNavigator]="true"
              [yearNavigator]="true"
              yearRange="2000:2040"
              id="dateTo"
              useUtc
              class="w-100"
              [showIcon]="true"
            >
            </p-calendar>
          </div>
        </div>
      </p-panel>
      <div class="card card-w-title">
        <p-checkbox
          style="color: rgb(188, 15, 15)"
          label="Check All"
        ></p-checkbox>
        <div class="grid">
          <div class="p-col-12">
            <hot-table
              [hotId]="hotid"
              [data]="dataset"
              [licenseKey]="licensekey"
              [settings]="poapprovalstatus"
            >
            </hot-table>
          </div>
        </div>
      </div>
    </p-tabPanel>
  </p-tabView>
</div>
