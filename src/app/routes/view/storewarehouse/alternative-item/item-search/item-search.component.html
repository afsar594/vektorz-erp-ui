<p-toolbar>
    <div class="ui-toolbar-group-left">
        <button pButton type="button" label="Show" icon="fa fa-search" class="ui-button-info"></button>
         <button pButton type="button" label="Ok" icon="fa fa-floppy-o" class="ui-button-success"></button>
        <button pButton type="button" label="Add" icon="fa fa-plus" class="ui-button-info"></button>
         <button pButton type="button" label="Exit" icon="fa fa-sign-out"></button>
    </div>
</p-toolbar>
<div class="p-grid">
    <div class="p-col-12">
        <p-table >
            <ng-template pTemplate="header">
                <tr>
                    <th>Item Code</th>
                    <th>Part No</th>
                    <th>Barcode</th>
                    <th>Name</th>
                    <th>Stock</th> 
                </tr>
            </ng-template>
            <ng-template pTemplate="body" >
                <tr>
                    <td> </td>
                    <td> </td>
                    <td> </td>
                    <td> </td>
                    <td> </td>
                </tr>
            </ng-template>
        </p-table>

    </div>
</div>
