<app-page-header [title]="title | translate"></app-page-header>
<div class="card card-w-title">
  <div class="p-grid p-ai-center">
    <div class="p-col-12 p-md-1">
      {{ "Item" | translate }}
    </div>
    <div class="p-col-12 p-md-6">
      <p-dropdown
        filter="true"
        filter="true"
        [style]="{ width: '100%' }"
        options=""
        placeholder="---All---"
        [showClear]="true"
      >
      </p-dropdown>
    </div>
  </div>
  <div class="grid">
    <div class="p-col-12">
      <hot-table
        [hotId]="hotid"
        [data]="dataset"
        [licenseKey]="licensekey"
        [settings]="Alternative"
      >
      </hot-table>
    </div>
  </div>
</div>
