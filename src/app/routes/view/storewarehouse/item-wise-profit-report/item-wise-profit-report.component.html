<app-page-header [title]="title | translate"> </app-page-header>
<p-toolbar>
  <div class="ui-toolbar-group-right">
    <button
      pButton
      type="button"
      label="Print Preview"
      [disabled]="!Permission?.Print"
      (click)="showPrint()"
      icon="fa fa-print"
      class="ui-button-success"
    ></button>
    <button
      pButton
      type="button"
      label="clear"
      (click)="clear()"
      icon="fa fa-close"
      class="ui-button-danger"
    ></button>
  </div>
</p-toolbar>
<div class="card card-w-title">
  <p-tabView>
    <p-tabPanel [header]="'Item Wise Profit Report' | translate">
      <div class="p-grid">
        <div class="p-col-8">
          <p-panel>
            <p-header>
              <input
                (click)="toggleDate()"
                [(ngModel)]="enableDate"
                type="checkbox"
                pInputCheck
              />
              By Date
            </p-header>
            <div class="p-grid">
              <div class="p-col-2">
                <label for="fromDate">From </label>
              </div>
              <div class="p-col-10 p-lg-10">
                <p-calendar
                  appendTo="body"
                  dateFormat="dd/mm/yy"
                  [showButtonBar]="true"
                  [monthNavigator]="true"
                  [yearNavigator]="true"
                  yearRange="2000:2040"
                  useUtc
                  id="dateFrom"
                  showButtonBar="true"
                  [showIcon]="true"
                  [(ngModel)]="dateFrom"
                  name="dateFrom"
                  [disabled]="!enableDate"
                  [ngModelOptions]="{ standalone: true }"
                >
                </p-calendar>
              </div>
            </div>
            <div class="p-grid">
              <div class="p-col-2">
                <label for="fromDate">To </label>
              </div>
              <div class="p-col-10 p-lg-10">
                <p-calendar
                  appendTo="body"
                  dateFormat="dd/mm/yy"
                  [showButtonBar]="true"
                  [monthNavigator]="true"
                  [yearNavigator]="true"
                  yearRange="2000:2040"
                  useUtc
                  id="dateTo"
                  showButtonBar="true"
                  [showIcon]="true"
                  [(ngModel)]="dateTo"
                  name="dateTo"
                  [disabled]="!enableDate"
                  [ngModelOptions]="{ standalone: true }"
                >
                </p-calendar>
              </div>
            </div>
          </p-panel>
        </div>
      </div>
      <div class="p-grid">
        <div class="p-col-1">
          <label for="itemgroup">Item Group : </label>
        </div>
        <div class="p-col-7">
          <p-dropdown
            filter="true"
            [(ngModel)]="itemGroup"
            [ngModelOptions]="{ standalone: true }"
            class="w-100"
            name="itemGroup"
            id="itemGroup"
            [options]="ItemMasterGroupList"
            filter="true"
          >
          </p-dropdown>
        </div>
      </div>
      <div class="p-grid">
        <div class="p-col-1">
          <label for="item">Item: </label>
        </div>
        <div class="p-col-7">
          <p-dropdown
            filter="true"
            class="w-100"
            [(ngModel)]="rptItem"
            [ngModelOptions]="{ standalone: true }"
            name="rptItem"
            id="rptItem"
            [options]="ItemMasterList"
          >
          </p-dropdown>
        </div>
      </div>
      <div class="p-grid">
        <div class="p-col-1">
          <label for="customer">Customer : </label>
        </div>
        <div class="p-col-7">
          <p-dropdown
            appDropdownOptionTitle
            filter="true"
            class="w-100"
            [(ngModel)]="customer"
            name="customer"
            [ngModelOptions]="{ standalone: true }"
            [options]="customerList"
          >
          </p-dropdown>
        </div>
        <div class="p-col-4"></div>
      </div>
    </p-tabPanel>
  </p-tabView>
</div>
