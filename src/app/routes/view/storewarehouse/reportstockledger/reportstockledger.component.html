<app-page-header
  [nav]="[
    { label: 'account' | translate },
    { label: 'Stock Report' | translate }
  ]"
  [title]="title | translate"
></app-page-header>
<p-toolbar>
  <div class="ui-toolbar-group-left">
    <button
      pButton
      type="button"
      class="ui-button-danger"
      label="Clear&Enable"
      (click)="new()"
      icon="fa fa-ban"
    ></button>
    <button
      pButton
      type="button"
      (click)="List_REPORT()"
      label="List"
      icon="fa fa-list"
    ></button>
  </div>

  <div class="ui-toolbar-group-right">
    <button
      pButton
      type="button"
      label="Print"
      icon="fa fa-print"
      class="ui-button-success"
      (click)="Print_REPORT()"
    ></button>
    <button pButton type="button" label="Exit" icon="fa fa-sign-out"></button>
  </div>
</p-toolbar>
