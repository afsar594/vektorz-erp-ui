<app-page-header [nav]='breadcumbmodel' [title]='title'></app-page-header>

<div class="card card-w-title" [formGroup]='ChangePasswordForm'>
    <p-panel [style]="{width:'40%',margin:'auto'}"> 
        <p-header>
            Change Password
        </p-header>
        <div class="p-grid">
            <label class="p-col-4 p-md-4 p-lg-4" for="account" style="text-align:center">
                <b>{{'User Name' | translate}}</b>
            </label>
            <div class="p-col-8 p-md-8 p-lg-8">
                <input disabled pInputText [style]="{width:'90%'}" formControlName='UserName'>
                <div class="error" *ngIf="f.UserName.touched && f.UserName.invalid">
                    <span> User Name is Mandatory Field*</span>
                </div>
            </div>
        </div>
        <!-- <div class="p-grid">
            <label class="p-col-4 p-md-4 p-lg-4 " for="account" style="text-align:center">
                <b>{{'Old Password:' | translate}}</b>
            </label>
            <div class="p-col-8 p-md-8 p-lg-8">
                <input pInputText disabled [style]="{width:'90%'}" formControlName='OldPassword' type="password">
                <div class="error" *ngIf="f.OldPassword.touched && f.OldPassword.invalid">
                    <span> Old Password is Mandatory Field*</span>
                </div>
            </div>
        </div> -->
        <div class="p-grid">
            <label class="p-col-4 p-md-4 p-lg-4 " for="account" style="text-align:center">
                <b>{{'New Password' | translate}}<span class="required">*</span></b>
            </label>
            <div class="p-col-8 p-md-8 p-lg-8">
                <div class="ui-inputgroup">
                    <input pInputText [style]="{width:'100%'}" (input)="password()" formControlName='NewPassword'
                        [type]="passwordType">
                    <button type="button" pButton class="p-inputgroup-addon" *ngIf="!showPassword"
                        (click)="togglePassShow()" icon="pi pi-eye-slash">
                    </button>
                    <button type="button" pButton class="p-inputgroup-addon" *ngIf="showPassword"
                        (click)="togglePassShow()" icon="pi pi-eye-slash">
                    </button>
                </div>
                <div class="error" *ngIf="f.NewPassword.touched">
                    <span *ngIf="f.NewPassword.touched && f.NewPassword.invalid"> minimum 6 & maximum 20 length
                        required*</span>
                </div>
            </div>
        </div>
        <div class="p-grid">
            <label class="p-col-4 p-md-4 p-lg-4 " for="account" style="text-align:center">
                <b>{{'Retype Password' | translate}}<span class="required">*</span></b>
            </label>
            <div class="p-col-8 p-md-8 p-lg-8">
                <div class="ui-inputgroup">
                    <input pInputText [style]="{width:'100%'}" (input)="password()" formControlName='RetypePassword'
                        [type]="passwordType">
                    <button type="button" pButton class="p-inputgroup-addon" *ngIf="!showPassword"
                        (click)="togglePassShow()" icon="pi pi-eye-slash"></button>
                    <button type="button" pButton class="p-inputgroup-addon" *ngIf="showPassword"
                        (click)="togglePassShow()" icon="pi pi-eye-slash"></button>
                </div>
                <div class="error" *ngIf="f.RetypePassword.touched">
                    <span *ngIf="f.NewPassword.touched && f.NewPassword.invalid"> minimum 6 & maximum 20 length
                        required*</span>
                    <span *ngIf="matchPass"> Password does not match !</span>
                </div>
            </div>
        </div>
        <br>
        <div class="icon" style="display: flex;align-items: center;justify-content: center;">
            <button pButton type="button" label="Change" class="ui-button-primary" [style]="{width:'25%'}" (click)="changePassword()"></button>
            <button pButton type="button" label="Exit" class="ui-button-primary" [style]="{width:'25%'}" (click)="ExitNew()"></button>
        </div>
    </p-panel>
</div>
<p-confirmDialog key="confirm-key" acceptLabel="Yes" rejectLabel="No" header="Confirm"
    [(visible)]="confirmDropDatabaseDialogVisible"></p-confirmDialog>
    <p-toast [style]="{marginTop: '80px'}"></p-toast>
