<app-page-header
  [nav]="[
    { label: 'Master' | translate },
    { label: 'Depreciation Register' | translate }
  ]"
  [title]="title | translate"
></app-page-header>
<p-toolbar>
  <div class="ui-toolbar-group-right">
    <button
      pButton
      type="button"
      class="ui-button-info"
      [disabled]="!Permission?.View"
      label="Show"
      icon="pi pi-search"
    ></button>
    <button
      pButton
      type="button"
      class="ui-button-success"
      [disabled]="!Permission?.Print"
      label="Print"
      icon="fa fa-print"
    ></button>
  </div>
</p-toolbar>
<div class="card card-w-title">
  <p-tabView [activeIndex]="index" (onChange)="handleChange($event)">
    <p-tabPanel [header]="'Depreciation Register' | translate">
      <div class="p-grid">
        <div class="p-col-6">
          <div class="p-grid">
            <label class="p-col-12 p-md-12 p-lg-3">{{
              "Search String" | translate
            }}</label>
            <div class="p-col-12 p-md-12 p-lg-9">
              <input class="w-100" pInputText />
            </div>
            <label class="p-col-12 p-md-12 p-lg-3">{{
              "Depreciation Upto" | translate
            }}</label>
            <div class="p-col-12 p-md-12 p-lg-9">
              <p-calendar
                appendTo="body"
                dateFormat="dd/mm/yy"
                [showButtonBar]="true"
                [monthNavigator]="true"
                [yearNavigator]="true"
                yearRange="2000:2040"
                class="w-100"
                useUtc
                [showIcon]="true"
              ></p-calendar>
            </div>
          </div>
        </div>
        <div class="p-col-6">
          <p-panel>
            <p-header>
              {{ "Asset Purchased Between" | translate }}
            </p-header>
            <div class="p-grid">
              <label class="p-col-12 p-md-12 p-lg-1">{{
                "From" | translate
              }}</label>
              <div class="p-col-12 p-md-12 p-lg-11">
                <p-calendar
                  appendTo="body"
                  dateFormat="dd/mm/yy"
                  [showButtonBar]="true"
                  [monthNavigator]="true"
                  [yearNavigator]="true"
                  yearRange="2000:2040"
                  class="w-100"
                  useUtc
                  [showIcon]="true"
                ></p-calendar>
              </div>
            </div>
            <div class="p-grid">
              <label class="p-col-12 p-md-12 p-lg-1">{{
                "To" | translate
              }}</label>
              <div class="p-col-12 p-md-12 p-lg-11">
                <p-calendar
                  appendTo="body"
                  dateFormat="dd/mm/yy"
                  [showButtonBar]="true"
                  [monthNavigator]="true"
                  [yearNavigator]="true"
                  yearRange="2000:2040"
                  class="w-100"
                  useUtc
                  [showIcon]="true"
                ></p-calendar>
              </div>
            </div>
          </p-panel>
        </div>
      </div>

      <div class="p-sm-12 p-md-12 p-lg-12">
        <div class="p-col-12">
          <p-panel>
            <p-header> Details </p-header>
            <hot-table
              [hotId]="hotid"
              [data]="dataset"
              [licenseKey]="licensekey"
              [settings]="depreciationregister"
            >
            </hot-table>
          </p-panel>
        </div>

        <div class="p-grid">
          <div class="p-sm-12 p-md-12 p-lg-12">
            <div class="p-col-12 p-grid">
              <label class="p-col-1" for="account">
                <b style="color: brown">{{ "Total Ass Value " | translate }}</b>
              </label>
              <div class="p-col-3">
                <input type="text" class="w-100" pInputText />
              </div>
              <label class="p-col-1" for="account">
                <b style="color: brown">{{ "Total Acc. Dep." | translate }}</b>
              </label>
              <div class="p-col-3">
                <input type="text" class="w-100" pInputText />
              </div>
              <label class="p-col-1" for="account">
                <b style="color: brown">{{ "Net Book Value" | translate }}</b>
              </label>
              <div class="p-col-3">
                <input type="text" class="w-100" pInputText />
              </div>
            </div>
          </div>
        </div>
      </div>
    </p-tabPanel>
  </p-tabView>
</div>
