<app-page-header [nav]='breadcumbmodel' [title]='title'></app-page-header>
<div class="card card-w-title" [formGroup]='BankGuaranteeMasterFormGroup'>
    <div class="p-grid">
        <div class="p-col-12 p-md-12 p-lg-1">Bankguarantee Name</div>
        <div class="p-col-12 p-md-12 p-lg-2">
            <input pInputText placeholder="Bankguarantee Name" formControlName='bankGuaranteeMasterBgname'>

            <div class="error" *ngIf="f.bankGuaranteeMasterBgname.errors 
            && (f.bankGuaranteeMasterBgname.dirty || f.bankGuaranteeMasterBgname.touched)">
                <span *ngIf="f.bankGuaranteeMasterBgname.errors.required">
                    BankGuarantee Name is Mandatory Field*</span>
            </div>

        </div>
           
    </div>

  <div class="p-grid">
    <div class="ui-g-12">
        <p-checkbox name="PDStatus" label="Status" [binary]="true" 
        formControlName='bankGuaranteeMasterStatus'
          ></p-checkbox></div>
           
  </div>
    <div class="p-grid">
        <div class="p-col-12 p-md-12 p-lg-offset-1 p-lg-6">
            <button pButton class="ui-button-info" [label]='btnlabel' (click)='saveBankGuarantee()'></button>
            <button pButton class="ui-button-warning" label='Clear' (click)='reset()'></button>
        </div>
    </div> 

    <div class="p-grid">
        <div class="p-col-12">
            <p-table [value]="bankguaranteeList">
                <ng-template pTemplate="header">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-bankGuarantee>
                    <tr>
                        <td>{{bankGuarantee.bankGuaranteeMasterBgid}}</td>
                        <td>{{bankGuarantee.bankGuaranteeMasterBgname}}</td>
                        <td>
                            <ng-container *ngIf="bankGuarantee.bankGuaranteeMasterStatus === true">
                            <input type="checkbox" [checked]="true" [disabled]="true"  />
                            </ng-container>
                            <ng-container *ngIf="bankGuarantee.bankGuaranteeMasterStatus === false">
                             <input type="checkbox" [checked]="false" [disabled]="true" />
                            </ng-container>
                        </td>
                        <td>
                            <button pButton type="button" icon="pi pi-pencil" (click)='updateValues(bankGuarantee)'
                                iconPos="left"></button>
                            <button pButton type="button" icon="pi pi-trash" (click)='removeBankGuarantee(bankGuarantee)'
                                iconPos="left"></button>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>
</div>
