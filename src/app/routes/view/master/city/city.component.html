<app-page-header [nav]="breadcumbmodel" [title]="title"></app-page-header>

<div class="toolbar">
  <div class="ui-toolbar-group-left p-d-flex p-flex-wrap responsive-toolbar">
    <button
      pButton
      type="button"
      [label]="'New' | translate"
      (click)="new()"
      icon="pi pi-plus"
    ></button>
  </div>
  <div class="ui-toolbar-group-right">
    <button
      pButton
      type="button"
      label="Exit"
      (click)="ExitNew()"
      icon="fa fa-sign-out"
    ></button>
  </div>
</div>

<div class="card card-w-title" [formGroup]="cityFormGroup">
  <div class="p-grid">
    <div class="p-col-12">
      <hot-table
        [hotId]="hotid"
        [licenseKey]="licensekey"
        [settings]="city_entry"
        [data]="city_entryDataset"
      ></hot-table>
    </div>
  </div>
</div>

<p-dialog
  [header]="operation.insert ? 'Add New City' : 'Update City'"
  [(visible)]="displayDialog"
  [modal]="true"
  [closable]="true"
  [dismissableMask]="true"
  [baseZIndex]="10000"
  [style]="{ width: '650px' }"
>
  <form [formGroup]="cityFormGroup" class="p-fluid">
    <div [style]="{ height: '200px' }">
      <div class="p-grid p-ai-center">
        <div class="p-col-1"></div>
        <div class="p-col-3 p-text-right">
          {{ "Country" | translate }}<span class="required">*</span>
        </div>
        <div class="p-col-6">
          <p-dropdown
            filter="true"
            [options]="countryListNew"
            formControlName="cityMasterCityCountryId"
            [filter]="true"
          ></p-dropdown>
        </div>
        <div class="p-col-2"></div>
        <div class="p-col-1"></div>
        <div class="p-col-3 p-text-right">
          {{ "City Name" | translate }}<span class="required">*</span>
        </div>
        <div class="p-col-6">
          <input
            pInputText
            placeholder="City Name"
            formControlName="cityMasterCityName"
          />
          <div
            class="error"
            *ngIf="
              f.cityMasterCityName.errors &&
              (f.cityMasterCityName.dirty || f.cityMasterCityName.touched)
            "
          >
            <span *ngIf="f.cityMasterCityName.errors.required"
              >City name is Mandatory Field*</span
            >
          </div>
        </div>
      </div>
    </div>

    <!-- Footer buttons (manually placed inside) -->
    <div class="dialog-footer">
      <p-button
        (click)="saveCity()"
        [icon]="operation.insert ? 'pi pi-save' : 'pi pi-check'"
        [label]="operation.insert ? 'Save' : 'Update'"
        styleClass="p-button-raised p-button-rounded p-button-success"
      ></p-button>
    </div>
  </form>
</p-dialog>

<p-confirmDialog
  key="confirm-key"
  acceptLabel="Yes"
  rejectLabel="No"
  header="Confirm"
></p-confirmDialog>
<p-toast></p-toast>
