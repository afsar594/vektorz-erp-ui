<app-page-header [title]="title | translate"></app-page-header>
<p-toolbar>
  <div class="ui-toolbar-group-left">
    <button
      pButton
      type="button"
      label="Show"
      (click)="showAll()"
      icon="fa fa-search"
      class="ui-button-info"
    ></button>
    <button
      pButton
      type="button"
      label="Print"
      icon="pi pi-print"
      class="ui-button-success"
    ></button>
  </div>
</p-toolbar>

<div class="card card-w-title">
  <p-tabView [activeIndex]="index" (onChange)="handleChange($event)">
    <p-tabPanel [header]="'Asset  Register' | translate">
      <form [formGroup]="assetForm">
        <div class="p-grid">
          <div class="p-col-6 p-md-6 p-lg-6">
            <div class="p-grid">
              <label class="p-col-3 p-md-3 p-lg-3" for="searchString">
                <b>{{ "Search String" | translate }}</b>
              </label>
              <div class="p-col-9 p-md-9 p-lg-9">
                <input
                  pInputText
                  placeholder="Search"
                  formControlName="searchText"
                />
              </div>
            </div>
            <div class="p-grid">
              <label class="p-col-3 p-md-3 p-lg-3" for="depreciationUpto">
                <b>{{ "Depriciation Upto" | translate }}</b>
              </label>
              <div class="p-col-9 p-md-9 p-lg-9">
                <p-calendar
                  appendTo="body"
                  dateFormat="dd/mm/yy"
                  [showButtonBar]="true"
                  [monthNavigator]="true"
                  [yearNavigator]="true"
                  yearRange="2000:2040"
                  useUtc
                  class="w-100"
                  [showIcon]="true"
                  formControlName="depDate"
                ></p-calendar>
              </div>
            </div>
          </div>
          <div class="p-col-6 p-md-6 p-lg-6">
            <p-panel header="Asset Purchased Between">
              <div class="p-grid">
                <label class="p-col-2 p-md-2 p-lg-2" for="purchasedFrom">
                  <b>{{ "From" | translate }}</b>
                </label>
                <div class="p-col-10 p-md-10 p-lg-10">
                  <p-calendar
                    appendTo="body"
                    dateFormat="dd/mm/yy"
                    [showButtonBar]="true"
                    [monthNavigator]="true"
                    [yearNavigator]="true"
                    yearRange="2000:2040"
                    useUtc
                    class="w-100"
                    [showIcon]="true"
                    formControlName="fromDate"
                  ></p-calendar>
                </div>
              </div>
              <div class="p-grid">
                <label class="p-col-2 p-md-2 p-lg-2" for="purchasedTo">
                  <b>{{ "To" | translate }}</b>
                </label>
                <div class="p-col-10 p-md-10 p-lg-10">
                  <p-calendar
                    appendTo="body"
                    dateFormat="dd/mm/yy"
                    [showButtonBar]="true"
                    [monthNavigator]="true"
                    [yearNavigator]="true"
                    yearRange="2000:2040"
                    useUtc
                    class="w-100"
                    [showIcon]="true"
                    formControlName="toDate"
                  ></p-calendar>
                </div>
              </div>
            </p-panel>
          </div>
        </div>
      </form>
      <div class="grid">
        <p-panel header="Asset Register Detail">
          <div class="p-col-12">
            <hot-table
              [hotId]="hotid"
              [licenseKey]="licensekey"
              [settings]="assetregister"
            >
            </hot-table>
          </div>
        </p-panel>
      </div>
    </p-tabPanel>
  </p-tabView>
</div>
