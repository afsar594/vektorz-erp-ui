<app-page-header [nav]="breadcumbmodel" [title]="title"></app-page-header>
<div class="toolbar">
  <div class="ui-toolbar-group-left p-d-flex p-flex-wrap responsive-toolbar">
    <button
      pButton
      type="button"
      [label]="'New' | translate"
      (click)="displayDialog = true"
      icon="pi pi-plus"
    ></button>
  </div>
  <div class="ui-toolbar-group-right">
    <button
      pButton
      type="button"
      label="Exit"
      (click)="ExitNew()"
      icon="fa fa-sign-out"
    ></button>
  </div>
</div>
<div class="card card-w-title" [formGroup]="costCenterFormGroup">
  <div class="p-grid">
    <div class="p-col-12">
      <hot-table
        [hotId]="hotid"
        [licenseKey]="licensekey"
        [settings]="costCenter_entry"
        [data]="costCenter_entryDataset"
      ></hot-table>
    </div>
  </div>
</div>
<p-dialog
  [header]="operation.insert ? 'Add New CostCenter' : 'Update CostCenter'"
  [(visible)]="displayDialog"
  [modal]="true"
  [closable]="true"
  [dismissableMask]="true"
  [baseZIndex]="10000"
  [style]="{ width: '650px' }"
>
  <form [formGroup]="costCenterFormGroup" class="p-fluid">
    <div class="p-grid p-ai-center">
      <div class="p-col-1"></div>
      <label class="p-col-3 p-text-right"
        >{{ "Cost Center Name" | translate
        }}<span class="required">*</span></label
      >
      <div class="p-col-6">
        <input
          pInputText
          placeholder="---Cost Center  Name---"
          formControlName="costCenterMasterCostCenterName"
        />

        <div
          class="error"
          *ngIf="
            f.costCenterMasterCostCenterName.errors &&
            (f.costCenterMasterCostCenterName.dirty ||
              f.costCenterMasterCostCenterName.touched)
          "
        >
          <span *ngIf="f.costCenterMasterCostCenterName.errors.required">
            Please Enter the Cost Center Name*</span
          >
        </div>
      </div>
      <div class="p-col-2"></div>
      <div class="p-col-1"></div>
      <label class="p-col-3 p-text-right">{{ "InActive" | translate }}</label>
      <div class="p-col-6">
        <p-checkbox
          [binary]="true"
          placeholder="Status"
          formControlName="costCenterMasterCostCenterStatus"
        ></p-checkbox>
      </div>
    </div>

    <!-- Footer buttons (manually placed inside) -->
    <div class="dialog-footer">
      <p-button
        (click)="saveCostCenter()"
        [icon]="operation.insert ? 'pi pi-save' : 'pi pi-check'"
        [label]="operation.insert ? 'Save' : 'Update'"
        styleClass="p-button-raised p-button-rounded p-button-success"
      ></p-button>
    </div>
  </form>
</p-dialog>

<p-confirmDialog
  key="confirm-key"
  acceptLabel="Yes"
  rejectLabel="No"
  header="Confirm"
></p-confirmDialog>
<p-toast></p-toast>
