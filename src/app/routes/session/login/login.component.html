<div class="wrapper background-pattern login">
  <div class="container">
    <div class="col-left">
      <div class="login-text">
        <h1>
          <img
            style="width: 220px"
            src="../../../../assets/Images/logo-2.png"
          />
        </h1>
        <!-- <h1>
          <img
            style="width: 220px"
            src="../../../../assets/Images/EQsoft.jpg"
          />
        </h1> -->

        <!-- <h1 style="color:#1f487e ;">Inspire Equinox ERP</h1> -->
        <p style="color: black">
          Forgot your password? <br /><a href="#">Click here to reset it</a>.
        </p>
      </div>
    </div>
    <div class="col-right">
      <div class="login-form">
        <h2>Login</h2>
        <form method="post" [formGroup]="loginForm" action>
          <p>
            <label>Location</label>
            <select
              formControlName="location"
              (change)="onLocationChange($event)"
            >
              <option [ngValue]="null">--select--</option>
              <option *ngFor="let loc of LocationmasterArry" [ngValue]="loc">
                {{ loc.locationMasterLocationName }}::{{
                  loc.locationMasterLocationId
                }}
              </option>
            </select>
          </p>
          <p>
            <label>Financial Period</label>
            <select formControlName="financialperiod">
              <option [value]="-1">--select--</option>
              <option *ngFor="let fin of FinacialPeriodArry" [value]="fin">
                {{ fin.financialPeriodsStartDate | date : "dd/MM/yy" }}::{{
                  fin.financialPeriodsEndDate | date : "dd/MM/yy"
                }}
              </option>
            </select>
          </p>
          <p>
            <label>User Id</label>
            <input
              type="text"
              name="login"
              value=""
              formControlName="username"
              placeholder="Username or Email"
            />
          </p>
          <p>
            <label>Password</label>
            <input
              type="password"
              name="password"
              formControlName="password"
              value=""
              placeholder="Password"
            />
          </p>
          <p>
            <p-triStateCheckbox
              [(ngModel)]="value"
              [ngModelOptions]="{ standalone: true }"
              label="Remember Me"
            ></p-triStateCheckbox>
          </p>
          <p style="display: flex; gap: 10px">
            <input
              type="submit"
              name="commit"
              (click)="clklogin()"
              value="Login"
            />
            <input
              type="submit"
              name="commit"
              (click)="clear()"
              value="Cancel"
            />
          </p>
        </form>
      </div>
    </div>
  </div>
</div>

<p-toast></p-toast>
