<div class="translator">
  <button
    type="button"
    class="translator__trigger"
    (click)="app.onTopbarLangButtonClick($event)"
    [title]="'Select Language' | translate"
  >
    <i class="pi pi-globe"></i>
    <span>{{ getCurrentLang().flag }} {{ getCurrentLang().nativeLabel }}</span>
    <i class="pi pi-angle-down"></i>
  </button>

  <ul
    class="lang-menu"
    [ngClass]="{ 'lang-menu--visible': app.topbarlangActive }"
  >
    <li
      class="lang-Items menuItem"
      *ngFor="let lang of languages"
      [ngClass]="{ 'active-lang': getCurrentLang().code === lang.code }"
      (click)="useLanguage(lang)"
    >
      <i class="pi pi-globe"></i>
      <a href="javascript:void(0)">
        <span class="topbar-item-name">{{ lang.flag }} {{ lang.nativeLabel }}</span>
      </a>
      <i *ngIf="getCurrentLang().code === lang.code" class="fa fa-check active-check"></i>
    </li>
  </ul>
</div>
